# Local rollout source policy. Default delegates to the existing vLLM path.
mode: single

# single uses model; mixtures use left/right. Null selects the mode default.
model: null
left: null
right: null
right_weight: 0.5

# Token fusion: arithmetic probability or geometric logit combination.
fusion_space: logit

micro_batch_size: 4

deadline_seconds: 3600.0

drain_seconds: 60.0

# Fusion-only execution; the default single/validation engine is unchanged.
execution:
  backend: vllm_fusion
  tensor_parallel_size: 1
  max_num_seqs: 2
  kv_cache_memory_bytes: 1073741824
  enforce_eager: true
