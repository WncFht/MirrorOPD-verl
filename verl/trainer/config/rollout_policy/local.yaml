# Local rollout source policy. Default delegates to the existing vLLM path.
mode: single

source: student

student: current

teacher_weight: 0.5

teacher_model_path: null

model_path: null

micro_batch_size: 4

deadline_seconds: 3600.0

drain_seconds: 60.0

# Fusion-only execution; the default single/validation engine is unchanged.
execution:
  backend: hf_fusion
  tensor_parallel_size: 1
  max_num_seqs: 2
  kv_cache_memory_bytes: 1073741824
  enforce_eager: true
