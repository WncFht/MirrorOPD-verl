repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.12.2"
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        # Source snapshots under docs are immutable; active tools live in code packages.
        exclude: ^.*\.ipynb$|^examples/mirroropd/docs/.*\.py$
      - id: ruff-format
        exclude: ^examples/mirroropd/docs/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: "v1.17.0"
    hooks:
      - id: mypy
        exclude: ^examples/mirroropd/docs/.*\.py$
        # Standalone research scripts can share a basename in different directories.
        entry: bash -c 'status=0; for file; do mypy "$file" || status=1; done; exit "$status"' --
        args: []

  - repo: local
    hooks:
      - id: check-source-artifacts
        name: Reject raw experiment artifacts and large source files
        entry: python3 meituan/code_archive.py check-source --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: autogen-trainer-cfg
        name: Generate and verify verl/trainer/config/_generated_*.yaml
        entry: scripts/generate_trainer_config.sh
        language: script
        pass_filenames: false

      - id: check-docs-time-info
        name: Check docs Last updated info
        entry: python3 tests/special_sanity/check_docs_time_info.py
        language: python
        pass_filenames: false

      - id: check-docstrings
        name: Check doc string coverage
        entry: python3 tests/special_sanity/check_docstrings.py
        language: python
        pass_filenames: false

      - id: check-license
        name: Check license
        exclude: ^examples/mirroropd/docs/.*\.py$
        entry: python3 tests/special_sanity/check_license.py --directories
        language: python
        types: [python]

      - id: check-mirroropd-docs
        name: Check MirrorOPD architecture and code-reading references
        entry: python3 examples/mirroropd/tools/check_docs.py
        language: python
        pass_filenames: false

      - id: check-device-api-usage
        name: Check device API usage
        entry: python3 tests/special_sanity/check_device_api_usage.py --directory ./verl
        language: python
        pass_filenames: false

      - id: check-dataproto-usage
        name: Check DataProto usage
        entry: python3 tests/special_sanity/check_dataproto_usage.py -d ./verl/workers/engine
        language: python
        pass_filenames: false

      - id: validate-structure
        name: Validate test structure
        entry: python3 tests/special_sanity/validate_structure.py
        language: python
        pass_filenames: false

      - id: check-naming-conventions
        name: Check naming conventions
        entry: sh -c 'if git grep -nI -E "veRL|Sglang|sgLang|sglAng|sglaNg|sglanG" -- . ":(exclude).pre-commit-config.yaml" ":(exclude).github/**" ":(exclude,glob)examples/mirroropd/docs/**/sources/**" ":(exclude,glob)examples/mirroropd/docs/archive/**" ":(exclude,glob)**/ascend_sglang_best_practices.rst"; then echo "Please use verl and SGLang or sglang"; exit 1; fi'
        language: system
        pass_filenames: false

      - id: check-example-naming
        name: Check example script naming convention
        entry: python3 tests/special_sanity/check_example_naming.py --root examples
        language: python
        pass_filenames: false

      - id: check-uv-gpu-only
        name: Check uv runs only on the GPU branch
        entry: python3 tests/special_sanity/check_uv_gpu_only.py
        language: python
        pass_filenames: false

      - id: compileall
        name: Compile all python files
        entry: python3 -W error -m compileall -q
        language: python
        types: [python]
        exclude: ^verl/experimental/vla/|^examples/mirroropd/docs/.*\.py$
